name: Build IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Archive
        run: |
          cd 1PanelClient
          xcodebuild archive \
            -project 1PanelClient.xcodeproj \
            -scheme 1PanelClient \
            -archivePath build/1PanelClient.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Package IPA
        run: |
          STAGING="/tmp/lc_payload"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/Payload"
          cp -R 1PanelClient/build/1PanelClient.xcarchive/Products/Applications/1PanelClient.app "$STAGING/Payload/"
          cd "$STAGING"
          zip -rq 1PanelClient.ipa Payload
          cp 1PanelClient.ipa "$GITHUB_WORKSPACE/1PanelClient.ipa"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1PanelClient-ipa
          path: 1PanelClient.ipa

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 1PanelClient.ipa
          generate_release_notes: true
