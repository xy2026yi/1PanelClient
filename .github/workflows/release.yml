name: Release IPA

# 发布路径：push v* tag → 打未签名 IPA（剔除小组件）→ 附到该 tag 的正式 release，
# 并生成 AltStore/SideStore 源（altstore.json，模板内嵌脚本）随 release 自链更新。
# 手动触发（workflow_dispatch）用于试跑流水线：只上传 artifact，不建 release。
# 注意：未签名 IPA 不能直接装机，需 Apple Developer 证书重签
# （AltStore / Sideloadly / fastlane resign）；接入正式签名后改造本文件即可。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ipa:
    name: 打包 IPA（未签名 · 剔除小组件）
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: SPM 依赖缓存
        uses: actions/cache@v4
        with:
          path: .ci-dd/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('1PanelClient/1PanelClient.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 归档（不签名，tag 写入版本号）
        run: |
          set -o pipefail
          # tag（v1.2.3 → 1.2.3）写入 MARKETING_VERSION；非 tag 触发（手动/分支）
          # 不是合法版本号，回落 0.0.0 仅为占位
          VER="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && ! "$VER" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            # tag 触发却非纯数字版本（如 v1.2.3-rc1）：静默降级 0.0.0 会把
            # 错误版本号发到 release，直接失败让打 tag 的人看见
            echo "::error::tag ${GITHUB_REF_NAME} 不是合法版本号（应为 v1.2.3 纯数字形态）"
            exit 1
          fi
          if [[ ! "$VER" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then VER="0.0.0"; fi
          xcodebuild archive \
            -project 1PanelClient/1PanelClient.xcodeproj \
            -scheme 1PanelClient \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -derivedDataPath .ci-dd \
            MARKETING_VERSION="$VER" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --renderer github-actions

      - name: 组 IPA（剔除小组件 appex）并生成校验和
        run: |
          cd build
          mkdir Payload
          cp -r App.xcarchive/Products/Applications/*.app Payload/
          # 小组件与主 App 仅编译期共享 PanelShared 源码，运行时无依赖；
          # 剔除后仅 iOS 桌面小组件不可用，App 功能不受影响
          rm -rf Payload/*.app/PlugIns/PanelWidgets.appex
          # PlugIns 残留空目录会让部分侧载工具（AltStore/Sideloadly）装机失败：
          # 目录已空则一并移除（rmdir 只删空目录，未来新增其他扩展不受影响）
          rmdir Payload/*.app/PlugIns 2>/dev/null || true
          # 分支名可含斜杠（feature/x），直接当文件名会让 zip 构建失败：替换为 -
          REF="${GITHUB_REF_NAME//\//-}"
          zip -qry "1PanelClient-${REF}.ipa" Payload
          shasum -a 256 "1PanelClient-${REF}.ipa" \
            > "1PanelClient-${REF}.ipa.sha256"
          echo "IPA_REF=${REF}" >> "$GITHUB_ENV"

      # tag 触发：建（或更新）该 tag 的正式 release 并附上 IPA
      - name: 附到 tag 的正式 release
        id: attach
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          # 附件缺失（上游步骤失败/产物名漂移）时让步骤失败，不静默发空 release
          fail_on_unmatched_files: true
          files: |
            build/1PanelClient-*.ipa
            build/*.ipa.sha256

      # 正式 release 建好后生成 AltStore/SideStore 源并上传附带：
      # 模板内嵌脚本；旧版本列表自链上一正式版的同名资产（releases API
      # 过滤 prerelease/draft，历史 pre-release 天然不入链）；
      # --clobber 覆盖上传，重跑不产生重复条目。用户加源地址见脚本头注释
      - name: 生成并上传 AltStore 源
        if: startsWith(github.ref, 'refs/tags/') && steps.attach.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IPA_PATH: build/1PanelClient-${{ env.IPA_REF }}.ipa
        run: bash 1PanelClient/scripts/update-altstore-source.sh

      # 手动触发：只传 artifact（无 tag 可挂 release）
      - name: 上传 artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: 1PanelClient-ipa-${{ env.IPA_REF }}
          path: build/*.ipa*
          retention-days: 14
